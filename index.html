<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DigiDex CS">
<meta name="theme-color" content="#0b1020">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>DigiDex CS</title>
<style>
:root{
  --bg:#0b1020;--panel:#131a2e;--panel2:#1a2340;--line:#26314f;--text:#e7ecf8;--mute:#8d99b8;
  --acc:#38e1c4;--acc2:#6aa8ff;--warn:#ffb547;--bad:#ff6b7a;
  --r:14px;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding-bottom:calc(64px + var(--safe-b))}
a{color:inherit;text-decoration:none}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
header{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(var(--safe-t) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;gap:10px;min-height:32px}
.hrow h1{font-size:19px;margin:0;flex:1;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow h1 b{color:var(--acc)}
.back{border:0;background:var(--panel2);color:var(--acc);font-size:15px;padding:6px 12px;border-radius:999px;font-weight:600}
.search{width:100%;margin-top:10px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 14px;font-size:16px;outline:none}
.search:focus{border-color:var(--acc)}
.filters{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
select{appearance:none;-webkit-appearance:none;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 28px 7px 12px;font-size:14px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;flex-shrink:0}
select.on{border-color:var(--acc);color:var(--acc)}
main{padding:12px 16px 24px;max-width:720px;margin:0 auto}
.count{color:var(--mute);font-size:13px;margin:2px 2px 8px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row:active{background:var(--panel2)}
.av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0;color:#0b1020}
.rmain{flex:1;min-width:0}
.rname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{color:var(--mute);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.num{color:var(--mute);font-size:12px}
.chev{color:var(--mute);font-size:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.t-Vaccine{color:#7fd1ff}.chip.t-Data{color:#9cf29c}.chip.t-Virus{color:#ff8fb1}.chip.t-Free{color:#d9d9d9}
.el-Fire{color:#ff8a5c}.el-Water{color:#5cb8ff}.el-Plant{color:#7ee07e}.el-Earth{color:#d8b26a}.el-Wind{color:#9ff0d6}.el-Electric{color:#ffe15c}.el-Light{color:#fff2b0}.el-Dark{color:#c09bff}.el-Neutral{color:#c4cbe0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mute);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card h2 span{color:var(--acc);text-transform:none;letter-spacing:0}
.hero{display:flex;gap:14px;align-items:center}
.hero .av{width:64px;height:64px;font-size:22px;border-radius:16px}
.hero h3{margin:0;font-size:22px;line-height:1.15}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kv div{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.kv small{display:block;color:var(--mute);font-size:11px}
.kv b{font-size:14px}
.reqs{display:flex;flex-wrap:wrap;gap:6px}
.req{font-size:12.5px;padding:3px 8px;border-radius:8px;background:rgba(56,225,196,.1);color:var(--acc);border:1px solid rgba(56,225,196,.25)}
.req.x{background:rgba(255,181,71,.1);color:var(--warn);border-color:rgba(255,181,71,.3)}
.req.none{background:transparent;color:var(--mute);border-color:var(--line)}
.evo{display:block;border-top:1px solid var(--line);padding:10px 0}
.evo:first-of-type{border-top:0;padding-top:0}
.evo .top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.evo .av{width:34px;height:34px;font-size:13px;border-radius:9px}
.evo .nm{font-weight:600;flex:1}
.empty{color:var(--mute);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;color:var(--mute)}
th{color:var(--mute);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
.sk{border-top:1px solid var(--line);padding:10px 0}
.sk:first-of-type{border-top:0;padding-top:0}
.sk .top{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.sk .nm{font-weight:600}
.sk .lv{color:var(--acc);font-size:12px;white-space:nowrap}
.sk .meta{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 4px}
.sk p{margin:0;color:#c3cbe0;font-size:13.5px}
.btn{display:block;width:100%;text-align:center;background:var(--acc);color:#05201b;font-weight:700;border:0;border-radius:12px;padding:12px;font-size:15px}
.btn.ghost{background:var(--panel2);color:var(--acc);border:1px solid var(--line)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:8px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);padding:7px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--panel2);color:var(--text);font-weight:600}
.field{margin-bottom:10px}
.field label{display:block;color:var(--mute);font-size:12px;margin:0 0 4px 2px}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .dir{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;margin-top:2px}
.dir.up{background:rgba(56,225,196,.15);color:var(--acc)}
.dir.dn{background:rgba(106,168,255,.15);color:var(--acc2)}
.dir.st{background:var(--panel2);color:var(--mute)}
.skbox{display:none;margin-top:8px}
.sk.open .skbox{display:block}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who a{font-size:13px;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.who a i{color:var(--acc);font-style:normal;margin-left:4px;font-size:11px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(11,16,32,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav a{flex:1;text-align:center;padding:8px 0 7px;color:var(--mute);font-size:11px}
nav a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
nav a.on{color:var(--acc)}
.note{color:var(--mute);font-size:12px;margin-top:6px}
.fav{border:0;background:transparent;font-size:22px;color:var(--mute);padding:0 4px}
.fav.on{color:var(--warn)}
</style>
</head>

function initials(n){const p=n.replace(/[()\.]/g," ").split(/\s+/).filter(Boolean);let s=p[0].replace(/mon$/i,"");return (s.slice(0,2)).toUpperCase()}
function av(m){return `<div class="av" style="background:${STC[m.stage]||"#ccc"}">${esc(initials(m.name))}</div>`}
function chips(m){return `<span class="chip">${esc(m.stage)}</span><span class="chip t-${m.type}">${esc(m.type)}</span><span class="chip el-${m.el}">${esc(m.el)}</span>`}
function reqPills(m){
  const r=m.req||{};const out=[];
  const ex=r["Extra Condition"];
  if(ex==="Starter digimon")return `<div class="reqs"><span class="req none">Starter Digimon (no requirements)</span></div>`;
  if(ex==="Cannot digivolve")return `<div class="reqs"><span class="req x">Cannot be obtained by digivolving</span></div>`;
  if(r.Level)out.push(`<span class="req">Lv ${r.Level}</span>`);
  for(const k of ["HP","SP","ATK","DEF","INT","SPD"])if(r[k])out.push(`<span class="req">${k} ${r[k]}</span>`);
  if(r.ABI)out.push(`<span class="req">ABI ${r.ABI}</span>`);
  if(r.CAM)out.push(`<span class="req">CAM ${esc(r.CAM)}</span>`);
  if(ex)out.push(`<span class="req x">${esc(ex)}</span>`);
  if(!out.length)out.push(`<span class="req none">No requirements</span>`);
  return `<div class="reqs">${out.join("")}</div>`;
}
function rowHTML(m,extra=""){return `<a class="row" href="#/d/${m.n}">${av(m)}<div class="rmain"><div class="rname">${esc(m.name)}</div><div class="rsub"><span class="num mono">#${String(m.n).padStart(3,"0")}</span><span>${esc(m.stage)}</span>·<span class="t-${m.type}" style="color:inherit">${esc(m.type)}</span>·<span class="el-${m.el}">${esc(m.el)}</span>${extra}</div></div><span class="chev">›</span></a>`}
function opts(list,cur,label){return `<option value="">${label}</option>`+list.map(x=>`<option ${x===cur?"selected":""}>${x}</option>`).join("")}
function setNav(t){document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.t===t))}
function findMon(s){if(!s)return null;const k=s.trim().toLowerCase();if(k in byName)return M[byName[k]];const n=norm(s);return M.find(m=>norm(m.name)===n)||null}

function bfs(a,b,mode){
  const prev=new Map([[a,null]]);const q=[a];
  while(q.length){const c=q.shift();if(c===b)break;
    const nb=[...M[c].to.map(i=>[i,"up"]),...(mode==="both"?M[c].fr.map(i=>[i,"dn"]):[])];
    for(const [i,d] of nb)if(!prev.has(i)){prev.set(i,[c,d]);q.push(i)}}
  if(!prev.has(b))return null;
  const path=[];let c=b;while(c!==a){const [p,d]=prev.get(c);path.unshift([c,d]);c=p}return path;
}

  setNav("route");

    <datalist id="dl">${M.map(m=>`<option value="${esc(m.name)}">`).join("")}</datalist>

    <div class="seg"><button data-m="both" class="${st.mode==="both"?"on":""}">Digivolve + De-digivolve</button><button data-m="up" class="${st.mode==="up"?"on":""}">Digivolve only</button></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="go">Find shortest route</button><button class="btn ghost" id="sw" style="width:56px;flex-shrink:0">⇅</button></div>
  </div><div id="rr"></div>`;
  const run=()=>{
    st.from=$("#rf").value;st.to=$("#rt").value;
    const a=findMon(st.from),b=findMon(st.to),out=$("#rr");
    if(!st.from&&!st.to){out.innerHTML=`<div class="note" style="padding:0 4px">Pick two Digimon to see the fewest digivolve / de-digivolve steps between them, with requirements for each step.</div>`;return}
    if(!a||!b){out.innerHTML=`<div class="card"><div class="empty">${!a?"“From”":"“To”"} Digimon not found. Pick a name from the suggestions.</div></div>`;return}
    if(a===b){out.innerHTML=`<div class="card"><div class="empty">Same Digimon — nothing to do.</div></div>`;return}
    const p=bfs(a.i,b.i,st.mode);
    if(!p){out.innerHTML=`<div class="card"><div class="empty">No route found${st.mode==="up"?" using digivolve only. Try allowing de-digivolve.":"."}</div></div>`;return}
    out.innerHTML=`<div class="card"><h2>${p.length} step${p.length>1?"s":""}</h2>
      <div class="step"><span class="dir st">START</span><div style="flex:1"><a href="#/d/${a.n}"><b>${esc(a.name)}</b></a> <span class="num">${esc(a.stage)}</span></div></div>
      ${p.map(([i,d])=>{const m=M[i];return `<div class="step"><span class="dir ${d}">${d==="up"?"▲ EVO":"▼ DE-EVO"}</span><div style="flex:1"><a href="#/d/${m.n}"><b>${esc(m.name)}</b></a> <span class="num">${esc(m.stage)}</span>${d==="up"?`<div style="margin-top:6px">${reqPills(m)}</div>`:`<div class="note" style="margin-top:2px">No requirements</div>`}</div></div>`}).join("")}
    </div>`;
  };
  $("#go").onclick=run;
  $("#sw").onclick=()=>{const f=$("#rf").value;$("#rf").value=$("#rt").value;$("#rt").value=f;run()};
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));run()});
  ["#rf","#rt"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter"){e.target.blur();run()}}));
  run();window.scrollTo(0,0);
}

/* ---------- Saved ---------- */
function viewFavs(){
  setNav("favs");
  $("#hd").innerHTML=`<div class="hrow"><h1>Saved Digimon</h1></div>`;
  const L=favs.map(n=>M.find(m=>m.n===n)).filter(Boolean);
  $("#mn").innerHTML=L.length?`<div class="list">${L.map(m=>rowHTML(m)).join("")}</div>`:`<div class="card"><div class="empty">Tap ☆ on any Digimon page to save it here.</div></div>`;
  window.scrollTo(0,0);
}

/* ---------- Router ---------- */
let cur="";
function go(h){location.hash=h}
function route(){
  if(cur==="dex")st.scroll=window.scrollY;
  const h=location.hash.slice(1)||"/";
  const [path,qs]=h.split("?");const params=new URLSearchParams(qs||"");
  let m;
  if((m=path.match(/^\/d\/(\d+)/))){cur="d";viewDetail(+m[1])}
  else if(path==="/skills"){cur="skills";viewSkills()}
  else if(path==="/route"){cur="route";viewRoute(params)}
  else if(path==="/favs"){cur="favs";viewFavs()}
  else{cur="dex";viewDex()}
}
window.addEventListener("hashchange",route);
route();
</script>
